name: Native validation

on:
  workflow_dispatch:
    inputs:
      build_upgrade_fixture:
        description: Build an isolated v0.1.1 prior-code Windows Setup for desktop upgrade testing
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  packages:
    uses: ./.github/workflows/package-build.yml
    with:
      source_sha: ${{ github.sha }}
      signed: false
      build_upgrade_fixture: ${{ inputs.build_upgrade_fixture }}
