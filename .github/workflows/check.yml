name: Check

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-helpers:
    runs-on: windows-2022
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use preinstalled runner Python
        shell: pwsh
        timeout-minutes: 1
        run: |
          $versions = @(Get-ChildItem -LiteralPath "$env:RUNNER_TOOL_CACHE/Python" -Directory | Where-Object { $_.Name -match '^3\.12\.\d+$' } | Sort-Object { [version]$_.Name } -Descending)
          $cached = @($versions | Where-Object { (Test-Path -LiteralPath "$($_.FullName)/x64.complete") -and (Test-Path -LiteralPath "$($_.FullName)/x64/python.exe" -PathType Leaf) })
          if (!$cached.Count) { throw 'Preinstalled Python 3.12 x64 missing from runner tool cache; no download is permitted.' }
          $pythonRoot = Join-Path $cached[0].FullName 'x64'
          $python = Join-Path $pythonRoot 'python.exe'
          $version = & $python -c 'import sys; assert sys.version_info[:2] == (3, 12); print(sys.version.split()[0])'
          if ($LASTEXITCODE) { throw 'Preinstalled Python version probe failed.' }
          $pythonRoot | Add-Content -LiteralPath $env:GITHUB_PATH
          New-Item -ItemType Directory -Force build/evidence | Out-Null
          [ordered]@{ schema = 1; role = 'CI bootstrap'; source = 'preinstalled-runner-toolcache'; path = $python; version = "$version" } | ConvertTo-Json | Tee-Object -FilePath build/evidence/windows-bootstrap-python.json
      - name: Windows PowerShell helper regressions
        shell: powershell
        run: ./scripts/release/test-smoke-desktop-windows.ps1
      - name: Final Windows package byte validation regressions
        shell: pwsh
        run: ./scripts/release/test-smoke-windows.ps1
      - name: PowerShell 7 helper regressions
        shell: pwsh
        run: ./scripts/release/test-smoke-desktop-windows.ps1
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.15.9
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.0
          cache: pnpm
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.98.0
          components: rustfmt
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - run: pnpm exec tsc --noEmit
      - run: pnpm test
      - run: python3 -m unittest discover -s scripts/release -p 'test_*.py'
      # Discovery skips this hyphenated module name.
      - run: python3 scripts/release/test-source-windows.py
      - run: python3 scripts/release/release.py check
