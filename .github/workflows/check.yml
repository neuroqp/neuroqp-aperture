name: Check

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-helpers:
    runs-on: windows-2022
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Use preinstalled runner Python
        shell: pwsh
        timeout-minutes: 1
        run: |
          $versions = @(Get-ChildItem -LiteralPath "$env:RUNNER_TOOL_CACHE/Python" -Directory | Where-Object { $_.Name -match '^3\.12\.\d+$' } | Sort-Object { [version]$_.Name } -Descending)
          $cached = @($versions | Where-Object { (Test-Path -LiteralPath "$($_.FullName)/x64.complete") -and (Test-Path -LiteralPath "$($_.FullName)/x64/python.exe" -PathType Leaf) })
          if (!$cached.Count) { throw 'Preinstalled Python 3.12 x64 missing from runner tool cache; no download is permitted.' }
          $pythonRoot = Join-Path $cached[0].FullName 'x64'
          $python = Join-Path $pythonRoot 'python.exe'
          $version = & $python -c 'import sys; assert sys.version_info[:2] == (3, 12); print(sys.version.split()[0])'
          if ($LASTEXITCODE) { throw 'Preinstalled Python version probe failed.' }
          $pythonRoot | Add-Content -LiteralPath $env:GITHUB_PATH
          New-Item -ItemType Directory -Force build/evidence | Out-Null
          [ordered]@{ schema = 1; role = 'CI bootstrap'; source = 'preinstalled-runner-toolcache'; path = $python; version = "$version" } | ConvertTo-Json | Tee-Object -FilePath build/evidence/windows-bootstrap-python.json
      - name: Windows PowerShell helper regressions
        shell: powershell
        run: ./scripts/release/test-smoke-desktop-windows.ps1
      - name: Validated Windows packaging input regressions
        shell: pwsh
        run: ./scripts/release/test-stage-tested-windows.ps1
      - name: Final Windows package byte validation regressions
        shell: pwsh
        run: ./scripts/release/test-smoke-windows.ps1
      - name: PowerShell 7 helper regressions
        shell: pwsh
        run: ./scripts/release/test-smoke-desktop-windows.ps1
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.0
          cache: pnpm
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: 1.98.0
          components: rustfmt
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - run: pnpm exec tsc --noEmit
      - run: pnpm test
      - run: python3 scripts/release/test_release.py
      - run: python3 scripts/release/test_bounded.py
      - run: python3 scripts/release/test_source_transfer.py
      - run: python3 scripts/release/test_prepared_inputs.py
      - run: python3 scripts/release/test_linux_runtime.py
      - run: python3 scripts/release/test_reservation.py
      - run: python3 scripts/release/test_resume_publication.py
      - run: python3 scripts/release/test_smoke_desktop.py
      - run: python3 scripts/release/test_debian_render.py
      - run: python3 scripts/release/test_linux_smoke.py
      - run: python3 scripts/release/test_capture_linux.py
      - run: python3 scripts/release/test_lab.py
      - run: python3 scripts/release/test-source-windows.py
      - run: python3 scripts/release/release.py check
