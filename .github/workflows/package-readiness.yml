name: Prepare validated packaging inputs

on:
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
      validation_run_id:
        type: string
        required: true
      linux_runtime_url:
        type: string
        required: true
      linux_runtime_sha256:
        type: string
        required: true
      source_review_url:
        type: string
        required: true
      source_review_sha256:
        type: string
        required: true

permissions:
  contents: read
  actions: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}/scripts/release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Load reviewed orchestration helpers
        run: |
          mkdir -p build/tools build/prepared
          for helper in prepared-inputs.py linux-runtime.py; do
            git show "$GITHUB_SHA:scripts/release/$helper" > "build/tools/$helper"
          done
      - name: Require successful exact-source native validation
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATION_RUN_ID: ${{ inputs.validation_run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: python3 build/tools/prepared-inputs.py native-run "$VALIDATION_RUN_ID" "$SOURCE_SHA"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: stage-a-linux
          run-id: ${{ inputs.validation_run_id }}
          github-token: ${{ github.token }}
          path: build/native-validation
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Stage sealed tested Debian runtime and reviewed source identity
        env:
          RUNTIME_URL: ${{ inputs.linux_runtime_url }}
          RUNTIME_SHA256: ${{ inputs.linux_runtime_sha256 }}
          SOURCE_REVIEW_URL: ${{ inputs.source_review_url }}
          SOURCE_REVIEW_SHA256: ${{ inputs.source_review_sha256 }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 "$RUNTIME_URL" -o build/prepared/linux-runtime.tar.gz
          curl --fail --location --proto '=https' --tlsv1.2 "$SOURCE_REVIEW_URL" -o build/prepared/source-review.json
          python3 -c 'import json; from pathlib import Path; p=Path("build/native-validation"); print(next(p.rglob("stage-a-linux.json")))' > build/prepared/report-path.txt
          report=$(cat build/prepared/report-path.txt)
          binary=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["binary_sha256"])' "$report")
          native=$(SOURCE_REVIEW_SHA256="$SOURCE_REVIEW_SHA256" python3 -c 'import os,sys; from pathlib import Path; sys.path.insert(0,"scripts/release"); from release import source_plan; print(source_plan(Path("build/prepared/source-review.json"),os.environ["SOURCE_REVIEW_SHA256"])["native_dependencies_sha256"]["linux"])')
          python3 build/tools/linux-runtime.py stage build/prepared/linux-runtime.tar.gz build/linux-prepared --archive-sha256 "$RUNTIME_SHA256" --source-sha "$SOURCE_SHA" --binary-sha256 "$binary" --native-sha256 "$native"
          cp -a build/native-validation/dist dist
      - name: Prove restored CLI and package tools without creating a final package
        run: |
          node node_modules/@tauri-apps/cli/tauri.js --version
          node node_modules/@tauri-apps/cli/tauri.js signer sign --help
          build/linux-prepared/tools/usr/bin/appimagetool --version
          build/linux-prepared/tools/usr/bin/mksquashfs -version
      - name: Seal prepared inputs
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          VALIDATION_RUN_ID: ${{ inputs.validation_run_id }}
          SOURCE_REVIEW_SHA256: ${{ inputs.source_review_sha256 }}
        run: |
          python3 build/tools/prepared-inputs.py create --platform linux --source-sha "$SOURCE_SHA" --validation-run-id "$VALIDATION_RUN_ID" --packaging-run-id "$GITHUB_RUN_ID" --archive build/prepared/prepared-linux.tar.gz --manifest build/prepared/prepared-linux.json --automated-report "$(cat build/prepared/report-path.txt)" --buildinfo build/linux-prepared/runtime/usr/share/aperture/BUILDINFO.json --executable build/linux-prepared/runtime/usr/bin/aperture --development-archive build/native-validation/build/evidence/development-linux.tar.gz --tool-archive build/prepared/linux-runtime.tar.gz --source-plan build/prepared/source-review.json --source-plan-sha256 "$SOURCE_REVIEW_SHA256"
          mkdir -p build/restore-check
          python3 -c 'import importlib.util; from pathlib import Path; s=importlib.util.spec_from_file_location("prepared","build/tools/prepared-inputs.py"); m=importlib.util.module_from_spec(s); s.loader.exec_module(m); m.extract(Path("build/prepared/prepared-linux.tar.gz"),Path("build/restore-check"),m.PATHS["linux"])'
          node build/restore-check/node_modules/@tauri-apps/cli/tauri.js --version
          node build/restore-check/node_modules/@tauri-apps/cli/tauri.js signer sign --help
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: prepared-linux
          path: build/prepared/prepared-linux.tar.gz
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: prepared-manifest-linux
          path: build/prepared/prepared-linux.json
          if-no-files-found: error
          retention-days: 30

  windows:
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      CARGO_NET_OFFLINE: "true"
      CARGO_HOME: ${{ github.workspace }}/build/packaging-cargo-home
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Load reviewed orchestration helpers
        run: |
          New-Item -ItemType Directory -Force build/tools, build/prepared | Out-Null
          foreach ($helper in @('prepared-inputs.py', 'stage-tested-windows.ps1', 'prepare-windows-packaging.ps1')) {
            git show "${env:GITHUB_SHA}:scripts/release/$helper" | Set-Content "build/tools/$helper" -Encoding utf8
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Require successful exact-source native validation
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATION_RUN_ID: ${{ inputs.validation_run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: python build/tools/prepared-inputs.py native-run $env:VALIDATION_RUN_ID $env:SOURCE_SHA
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: stage-a-windows
          run-id: ${{ inputs.validation_run_id }}
          github-token: ${{ github.token }}
          path: build/native-validation
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.0
          cache: pnpm
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: 1.98.0
          targets: x86_64-pc-windows-msvc
      - run: pnpm install --frozen-lockfile
      - name: Prepare locked Cargo metadata cache
        env:
          CARGO_NET_OFFLINE: "false"
        run: cargo fetch --manifest-path src-tauri/Cargo.toml --locked --target x86_64-pc-windows-msvc
      - name: Stage exact tested Windows executable and runtime
        env:
          SOURCE_REVIEW_URL: ${{ inputs.source_review_url }}
          SOURCE_REVIEW_SHA256: ${{ inputs.source_review_sha256 }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          if (([uri]$env:SOURCE_REVIEW_URL).Scheme -ne 'https') { throw 'Reviewed source plan must use HTTPS' }
          Invoke-WebRequest $env:SOURCE_REVIEW_URL -OutFile build/prepared/source-review.json
          pwsh build/tools/stage-tested-windows.ps1 -Archive build/native-validation/build/evidence/development-windows.zip -AutomatedReport build/native-validation/build/evidence/stage-a-windows.json -SourceSha $env:SOURCE_SHA -SourcePlan build/prepared/source-review.json -SourcePlanSha256 $env:SOURCE_REVIEW_SHA256
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item build/native-validation/dist dist -Recurse
      - name: Prepare pinned installer tools
        run: |
          pwsh build/tools/prepare-windows-packaging.ps1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -c "import tarfile; from pathlib import Path; a=tarfile.open('build/windows-packaging-tools.tar.gz','w:gz',dereference=True); a.add('build/windows-packaging-tools',arcname='build/windows-packaging-tools'); a.close()"
      - name: Prove packaging commands without creating a final package
        run: |
          node node_modules/@tauri-apps/cli/tauri.js --version
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node node_modules/@tauri-apps/cli/tauri.js bundle --help
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo metadata --manifest-path src-tauri/Cargo.toml --no-deps --format-version 1 --offline --locked | Out-Null
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Seal and prove restored inputs
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          VALIDATION_RUN_ID: ${{ inputs.validation_run_id }}
          SOURCE_REVIEW_SHA256: ${{ inputs.source_review_sha256 }}
        run: |
          python build/tools/prepared-inputs.py create --platform windows --source-sha $env:SOURCE_SHA --validation-run-id $env:VALIDATION_RUN_ID --packaging-run-id $env:GITHUB_RUN_ID --archive build/prepared/prepared-windows.tar.gz --manifest build/prepared/prepared-windows.json --automated-report build/native-validation/build/evidence/stage-a-windows.json --buildinfo build/release/BUILDINFO-windows.json --executable src-tauri/target/x86_64-pc-windows-msvc/release/aperture.exe --development-archive build/native-validation/build/evidence/development-windows.zip --tool-archive build/windows-packaging-tools.tar.gz --source-plan build/prepared/source-review.json --source-plan-sha256 $env:SOURCE_REVIEW_SHA256
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -c "import importlib.util; from pathlib import Path; s=importlib.util.spec_from_file_location('prepared','build/tools/prepared-inputs.py'); m=importlib.util.module_from_spec(s); s.loader.exec_module(m); m.extract(Path('build/prepared/prepared-windows.tar.gz'),Path('build/restore-check'),m.PATHS['windows'])"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node build/restore-check/node_modules/@tauri-apps/cli/tauri.js --version
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node build/restore-check/node_modules/@tauri-apps/cli/tauri.js bundle --help
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:CARGO_HOME = "$env:GITHUB_WORKSPACE/build/restore-check/build/packaging-cargo-home"
          cargo metadata --manifest-path src-tauri/Cargo.toml --no-deps --format-version 1 --offline --locked | Out-Null
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python build/tools/prepared-inputs.py extract-tools build/restore-check/build/windows-packaging-tools.tar.gz build/restore-check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          pwsh build/tools/prepare-windows-packaging.ps1 -ToolsDirectory build/restore-check/build/windows-packaging-tools -CheckOnly
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: prepared-windows
          path: build/prepared/prepared-windows.tar.gz
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: prepared-manifest-windows
          path: build/prepared/prepared-windows.json
          if-no-files-found: error
          retention-days: 30
