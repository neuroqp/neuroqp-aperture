name: Build packages

on:
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
      source_review_sha256:
        type: string
        required: true
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: true
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: true

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: debian:12.12-slim@sha256:d5d3f9c23164ea16f31852f95bd5959aad1c5e854332fe00f7b3a20fcc9f635c
    env:
      APPIMAGE_EXTRACT_AND_RUN: "1"
      CARGO_INCREMENTAL: "0"
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates curl python3
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        timeout-minutes: 3
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Require frozen readiness before building
        timeout-minutes: 1
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REPOSITORY" = neuroqp/neuroqp-aperture
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test -n "$SIGNING_KEY"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        timeout-minutes: 3
        with:
          name: frozen-attempt
          path: build/evidence
      - run: python3 scripts/release/bounded.py deadline build/evidence/frozen-attempt.json
        timeout-minutes: 1
      - name: Prepare pinned Linux build tools
        timeout-minutes: 8
        run: python3 scripts/release/bounded.py run build/evidence/frozen-attempt.json build/evidence/linux-prepare.json --seconds 480 -- bash scripts/release/prepare-linux.sh
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        timeout-minutes: 3
        with:
          version: 9.15.9
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        timeout-minutes: 3
        with:
          node-version: 22.22.0
          cache: pnpm
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        timeout-minutes: 3
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        timeout-minutes: 3
        with:
          workspaces: src-tauri
          cache-on-failure: true
          key: debian12-vips8.18-signed
      - run: pnpm install --frozen-lockfile
        timeout-minutes: 3
      - name: Build updater-signed package
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: python3 scripts/release/bounded.py run build/evidence/frozen-attempt.json build/evidence/linux-build.json --seconds 1500 -- bash scripts/release/package-linux.sh
      - run: bash scripts/release/smoke-linux.sh
        timeout-minutes: 2
      - run: python3 scripts/release/bounded.py deadline build/evidence/frozen-attempt.json
        timeout-minutes: 1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        timeout-minutes: 3
        with:
          name: corresponding-source
          path: build/release
      - name: Verify corresponding source before binary artifact upload
        env:
          SOURCE_REVIEW_SHA256: ${{ inputs.source_review_sha256 }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: python3 scripts/release/release.py source-material build/release --platform linux --plan build/release/Aperture-Corresponding-Source.json --plan-sha256 "$SOURCE_REVIEW_SHA256" --source-sha "$SOURCE_SHA" --attempt build/evidence/frozen-attempt.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        timeout-minutes: 1
        if: always()
        with:
          name: stage-b-linux-timings
          path: build/evidence/linux-*.json
          if-no-files-found: ignore
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        timeout-minutes: 3
        with:
          name: packages-linux
          path: build/release/*
          if-no-files-found: error
          retention-days: 14

  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
      RUSTFLAGS: -C target-feature=+crt-static
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        timeout-minutes: 3
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Require frozen readiness before building
        timeout-minutes: 1
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ($env:GITHUB_RUN_ATTEMPT -ne '1' -or $env:GITHUB_REPOSITORY -ne 'neuroqp/neuroqp-aperture' -or $env:GITHUB_EVENT_NAME -ne 'workflow_dispatch' -or $env:GITHUB_REF -ne 'refs/heads/main' -or !$env:SIGNING_KEY) { throw 'Trusted main dispatch and signing key required' }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        timeout-minutes: 3
        with:
          name: frozen-attempt
          path: build/evidence
      - run: python scripts/release/bounded.py deadline build/evidence/frozen-attempt.json
        timeout-minutes: 1
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        timeout-minutes: 3
        with:
          arch: x64
      - name: Install pinned portable packager
        run: choco install nsis --version=3.11 --yes --no-progress --allow-downgrade
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        timeout-minutes: 3
        with:
          version: 9.15.9
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        timeout-minutes: 3
        with:
          node-version: 22.22.0
          cache: pnpm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        timeout-minutes: 3
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        timeout-minutes: 3
        with:
          toolchain: 1.98.0
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy
      - run: pnpm install --frozen-lockfile
        timeout-minutes: 3
      - name: Prepare pinned Windows dependencies
        timeout-minutes: 6
        run: python scripts/release/bounded.py run build/evidence/frozen-attempt.json build/evidence/windows-prepare.json --seconds 360 -- pwsh scripts/release/prepare-windows.ps1
      - name: Configure native tools
        run: |
          "APERTURE_NATIVE_DIR=$env:GITHUB_WORKSPACE\build\windows\native" >> $env:GITHUB_ENV
          "$env:GITHUB_WORKSPACE\build\windows\payload" >> $env:GITHUB_PATH
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        timeout-minutes: 3
        with:
          workspaces: src-tauri
          cache-on-failure: true
          key: windows-msvc-vips8.18.7-signed
          env-vars: APERTURE_NATIVE_DIR LIBCLANG_PATH
      - name: Collect build identity and license notices
        run: |
          python scripts/release/release.py buildinfo windows build/release build/windows/dependencies.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/release/notices.py windows build/windows/native-notices.txt build/release/THIRD-PARTY-NOTICES-windows.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item build/release/BUILDINFO-windows.json build/windows/payload/BUILDINFO.json
          Copy-Item build/release/THIRD-PARTY-NOTICES-windows.txt build/windows/payload/THIRD-PARTY-NOTICES.txt
      - name: Build updater-signed installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: python scripts/release/bounded.py run build/evidence/frozen-attempt.json build/evidence/windows-build.json --seconds 1500 -- cmd /d /c pnpm exec tauri build --target x86_64-pc-windows-msvc --bundles nsis -- --locked
      - name: Stage installer and build portable executable
        run: |
          $installers = @(Get-ChildItem src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe)
          if ($installers.Count -ne 1) { throw 'Expected exactly one installer' }
          Copy-Item $installers[0].FullName build/release/Aperture-Setup-x64.exe
          if (Test-Path ($installers[0].FullName + '.sig')) { Copy-Item ($installers[0].FullName + '.sig') build/release/Aperture-Setup-x64.exe.sig }
          python scripts/release/bounded.py run build/evidence/frozen-attempt.json build/evidence/windows-portable-build.json --seconds 480 -- pwsh scripts/release/build-portable.ps1 -Version (python scripts/release/release.py check)
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Sign portable updater asset
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        timeout-minutes: 1
        run: python scripts/release/bounded.py run build/evidence/frozen-attempt.json build/evidence/windows-portable-sign.json --seconds 60 -- cmd /d /c pnpm exec tauri signer sign --app-version (python scripts/release/release.py check) build/release/Aperture-Portable-x64.exe
      - run: pwsh scripts/release/smoke-windows.ps1 -Version (python scripts/release/release.py check) -Setup build/release/Aperture-Setup-x64.exe
        timeout-minutes: 3
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        timeout-minutes: 3
        if: always()
        with:
          name: windows-package-evidence
          path: |
            build/evidence/windows/*.png
            build/evidence/windows/*.json
            build/evidence/windows/*.txt
          if-no-files-found: ignore
          retention-days: 14
      - run: python scripts/release/bounded.py deadline build/evidence/frozen-attempt.json
        timeout-minutes: 1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        timeout-minutes: 3
        with:
          name: corresponding-source
          path: build/release
      - name: Verify corresponding source before binary artifact upload
        env:
          SOURCE_REVIEW_SHA256: ${{ inputs.source_review_sha256 }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: python scripts/release/release.py source-material build/release --platform windows --plan build/release/Aperture-Corresponding-Source.json --plan-sha256 $env:SOURCE_REVIEW_SHA256 --source-sha $env:SOURCE_SHA --attempt build/evidence/frozen-attempt.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        timeout-minutes: 1
        if: always()
        with:
          name: stage-b-windows-timings
          path: build/evidence/windows-*.json
          if-no-files-found: ignore
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        timeout-minutes: 3
        with:
          name: packages-windows
          path: build/release/*
          if-no-files-found: error
          retention-days: 14
