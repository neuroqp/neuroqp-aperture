name: Validate

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Build/test first; seal after native functional validation
        type: choice
        options: [build, seal]
        default: build
      source_sha:
        description: Exact reviewed source commit contained in main
        required: true
      build_run_id:
        description: Successful build-mode run (seal only)
      linux_runtime_url:
        description: Tested sealed Linux AppDir archive HTTPS URL (seal only)
      linux_runtime_sha256:
        description: SHA256 of tested Linux runtime archive (seal only)
      native_json:
        description: Windows11, Debian12 and Ubuntu24 Wayland functional reports JSON (seal only)

permissions:
  contents: read
  actions: read

jobs:
  trust:
    uses: ./.github/workflows/trusted-inputs.yml
    with:
      source_sha: ${{ inputs.source_sha }}
      # Seal consumes build artifacts, so its run is verified with this revision's helper.
      run_workflow: ${{ inputs.mode == 'seal' && 'validate.yml' || '' }}
      run_id: ${{ inputs.mode == 'seal' && inputs.build_run_id || '' }}

  linux:
    needs: [trust, source]
    if: inputs.mode == 'build' && needs.trust.outputs.revision == inputs.source_sha
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: debian:12.12-slim@sha256:d5d3f9c23164ea16f31852f95bd5959aad1c5e854332fe00f7b3a20fcc9f635c
    env:
      APPIMAGE_EXTRACT_AND_RUN: "1"
      CARGO_INCREMENTAL: "0"
    steps:
      # Preserve the reviewed native/source baseline before WebKit resolves its
      # indirect dependencies. The full dependency identity gate remains required.
      - run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates curl gstreamer1.0-plugins-good=1.22.0-5+deb12u3
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.trust.outputs.revision }}
          persist-credentials: false
      - run: bash scripts/release/prepare-linux.sh
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.15.9
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.0
          cache: pnpm
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          cache-on-failure: true
          key: debian12-vips8.18-signed
      - run: pnpm install --frozen-lockfile
      - run: python3 scripts/release/release.py check && python3 scripts/release/test_release.py && python3 scripts/release/test_smoke_desktop.py && python3 scripts/release/test-source-windows.py
      - run: pnpm format:check && pnpm test && pnpm build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - run: cargo build --manifest-path src-tauri/Cargo.toml --release --features custom-protocol --locked
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
        env:
          APERTURE_WORKER_EXECUTABLE: ${{ github.workspace }}/src-tauri/target/release/aperture
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: corresponding-source
          path: build/source-baseline
      - name: Stage native development runtime
        run: |
          mkdir -p build/evidence build/development/linux/bin build/development/linux/lib
          cp src-tauri/target/release/aperture /usr/bin/vips /usr/bin/vipsheader /usr/bin/tiffinfo build/development/linux/bin/
          # The Stage A Debian desktop already supplies GTK/WebKit and system codecs.
          cp -L /usr/lib/x86_64-linux-gnu/libvips.so.42 build/development/linux/lib/
          cp build/linux/dependencies.json build/development/linux/
          cp LICENSE build/development/linux/LICENSE.txt
          python3 scripts/release/release.py buildinfo linux build/development/linux build/linux/dependencies.json
          python3 scripts/release/notices.py linux build/linux/native-notices.txt build/development/linux/THIRD-PARTY-NOTICES-linux.txt
          # Reuse reviewed native/vendor bytes and current public Git source.
          # Baseline sources stay outside the development artifact; no new archive assembly.
          python3 scripts/release/release.py development-source --platform linux --source-sha "${{ inputs.source_sha }}" --directory build/development/linux --baseline-directory build/source-baseline
          tar -czf build/evidence/development-linux.tar.gz -C build/development linux
      - name: Record successful development validation
        run: python3 scripts/release/release-state.py build linux src-tauri/target/release/aperture build/development/linux/BUILDINFO-linux.json build/evidence/build-linux.json --source-sha "${{ inputs.source_sha }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: development-linux
          path: |
            src-tauri/target/release/aperture
            build/evidence/development-linux.tar.gz
            build/linux/dependencies.json
            build/evidence/build-linux.json
            dist/
          if-no-files-found: ignore
          retention-days: 90

  windows:
    needs: [trust, source]
    if: inputs.mode == 'build' && needs.trust.outputs.revision == inputs.source_sha
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: "0"
      RUSTFLAGS: -C target-feature=+crt-static
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.trust.outputs.revision }}
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64
      - name: Install pinned portable packager
        run: choco install nsis --version=3.11 --yes --no-progress --allow-downgrade
      - name: Check portable extraction and locking
        run: pwsh scripts/release/test-portable.ps1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.15.9
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.0
          cache: pnpm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.98.0
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy
      - run: pnpm install --frozen-lockfile
      - run: python scripts/release/release.py check; if ($LASTEXITCODE) { exit $LASTEXITCODE }; python scripts/release/test_release.py; if ($LASTEXITCODE) { exit $LASTEXITCODE }; python scripts/release/test_smoke_desktop.py; if ($LASTEXITCODE) { exit $LASTEXITCODE }; python scripts/release/test-source-windows.py
      - run: pwsh scripts/release/prepare-windows.ps1
      - name: Configure native tools
        run: |
          "APERTURE_NATIVE_DIR=$env:GITHUB_WORKSPACE\build\windows\native" >> $env:GITHUB_ENV
          "$env:GITHUB_WORKSPACE\build\windows\payload" >> $env:GITHUB_PATH
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          cache-on-failure: true
          key: windows-msvc-vips8.18.7-signed
          env-vars: APERTURE_NATIVE_DIR LIBCLANG_PATH
      - run: pnpm format:check; if ($LASTEXITCODE) { exit $LASTEXITCODE }; pnpm test; if ($LASTEXITCODE) { exit $LASTEXITCODE }; pnpm build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - run: pwsh scripts/release/test-smoke-desktop-windows.ps1
      - run: cargo build --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc --release --features custom-protocol --locked
      - run: cargo test --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc --locked
        env:
          APERTURE_WORKER_EXECUTABLE: ${{ github.workspace }}\src-tauri\target\x86_64-pc-windows-msvc\release\aperture.exe
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc --all-targets --locked -- -D warnings
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: corresponding-source
          path: build/source-baseline
      - name: Stage native development runtime
        run: |
          New-Item -ItemType Directory -Force build/evidence | Out-Null
          Copy-Item src-tauri/target/x86_64-pc-windows-msvc/release/aperture.exe build/windows/payload/aperture.exe
          python scripts/release/release.py buildinfo windows build/windows/payload build/windows/dependencies.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/release/notices.py windows build/windows/native-notices.txt build/windows/payload/THIRD-PARTY-NOTICES-windows.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # The source baseline is verified once here and never enters this runtime ZIP.
          python scripts/release/release.py development-source --platform windows --source-sha (git rev-parse HEAD) --directory build/windows/payload --baseline-directory build/source-baseline
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # Runtime files, development executable and pinned dependency identities travel together.
          python -c "import shutil; shutil.make_archive('build/evidence/development-windows', 'zip', 'build/windows/payload')"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Record successful development validation
        run: python scripts/release/release-state.py build windows src-tauri/target/x86_64-pc-windows-msvc/release/aperture.exe build/windows/payload/BUILDINFO-windows.json build/evidence/build-windows.json --source-sha "${{ inputs.source_sha }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: development-windows
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/aperture.exe
            build/evidence/development-windows.zip
            build/windows/dependencies.json
            build/evidence/build-windows.json
            dist/
          if-no-files-found: ignore
          retention-days: 90

  seal:
    needs: trust
    if: >-
      inputs.mode == 'seal' && github.ref == 'refs/heads/main' && needs.trust.outputs.revision == inputs.source_sha
      && needs.trust.outputs.run_id != '' && needs.trust.outputs.run_id == inputs.build_run_id
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.trust.outputs.revision }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: development-*
          run-id: ${{ needs.trust.outputs.run_id }}
          github-token: ${{ github.token }}
          path: build/development
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: corresponding-source
          run-id: ${{ needs.trust.outputs.run_id }}
          github-token: ${{ github.token }}
          path: build/validated/source
      - name: Seal tested runtime and native validation identity
        env:
          RUNTIME_URL: ${{ inputs.linux_runtime_url }}
          RUNTIME_SHA: ${{ inputs.linux_runtime_sha256 }}
          NATIVE_JSON: ${{ inputs.native_json }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          BUILD_RUN: ${{ needs.trust.outputs.run_id }}
        run: |
          cp build/development/build/evidence/build-*.json build/validated/
          cp build/development/build/evidence/development-windows.zip build/validated/
          cp -a build/development/dist build/validated/dist
          curl --fail --location --proto '=https' --tlsv1.2 "$RUNTIME_URL" -o build/validated/linux-runtime.tar.gz
          printf '%s  %s\n' "$RUNTIME_SHA" build/validated/linux-runtime.tar.gz | sha256sum --check
          python3 -c 'import os; from pathlib import Path; Path("build/validated/native.json").write_text(os.environ["NATIVE_JSON"])'
          python3 scripts/release/release-state.py validate build/validated --source-sha "$SOURCE_SHA" --build-run-id "$BUILD_RUN" --native-report build/validated/native.json --runtime build/validated/linux-runtime.tar.gz --output build/validated/validation.json
          python3 -c 'import json,subprocess; p=json.load(open("build/validated/validation.json")); l=p["platforms"]["linux"]; subprocess.run(["python3","scripts/release/linux-runtime.py","stage","build/validated/linux-runtime.tar.gz","build/runtime-check","--archive-sha256",p["linux_runtime_sha256"],"--source-sha",p["source_sha"],"--binary-sha256",l["binary_sha256"],"--native-sha256",l["native_dependencies_sha256"]],check=True)'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validated-inputs
          path: build/validated/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  source:
    needs: trust
    if: inputs.mode == 'build' && needs.trust.outputs.revision == inputs.source_sha
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.trust.outputs.revision }}
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/source-cache
          key: corresponding-source-${{ hashFiles('scripts/release/corresponding-source.json') }}
      - name: Complete corresponding source before packaging
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: python3 scripts/release/release.py source-material build/source --source-sha "$SOURCE_SHA" --fetch --cache build/source-cache
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: corresponding-source
          path: build/source/*
          if-no-files-found: error
          retention-days: 90
