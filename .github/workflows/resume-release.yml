name: Complete or revalidate existing candidate

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Complete an interrupted draft, or revalidate the pinned public candidate without uploads
        type: choice
        options: [complete, complete-public]
        default: complete
        required: true
      readiness_run_id:
        description: Fresh successful Stage A release-evidence run for unchanged v0.2.0 source
        required: true

permissions:
  contents: read
  actions: read

env:
  APERTURE_SOURCE_ROOT: ${{ github.workspace }}

concurrency:
  group: promote-release
  cancel-in-progress: false

jobs:
  complete:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 3c17c5cc19ce1da706c47031ad1ffb1b2a7338e3
          fetch-depth: 0
          persist-credentials: false
      - name: Load reviewed completion policy without changing application source
        run: |
          test "$GITHUB_RUN_ATTEMPT" = 1
          mkdir -p build/tools
          for helper in bounded.py release.py prepared-inputs.py resume_publication.py resume-publication.json public-candidate-recovery.json; do
            git show "$GITHUB_SHA:scripts/release/$helper" > "build/tools/$helper"
          done
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: frozen-attempt
          run-id: 38767160634
          github-token: ${{ github.token }}
          path: build/input/prior
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: frozen-candidate
          run-id: 38767160634
          github-token: ${{ github.token }}
          path: build/input/prior
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: inputs.mode == 'complete-public'
        with:
          name: frozen-attempt
          run-id: 38778871389
          github-token: ${{ github.token }}
          path: build/input/completed
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: inputs.mode == 'complete-public'
        with:
          name: frozen-candidate
          run-id: 38778871389
          github-token: ${{ github.token }}
          path: build/input/completed
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-readiness
          run-id: ${{ inputs.readiness_run_id }}
          github-token: ${{ github.token }}
          path: build/input/readiness
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: prepared-manifest-linux
          run-id: 38753573133
          github-token: ${{ github.token }}
          path: build/prepared
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: prepared-verifier
          run-id: 38753573133
          github-token: ${{ github.token }}
          path: build/prepared
      - name: Restore historical frozen verifier before completion freeze
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 build/tools/prepared-inputs.py restore-verifier build/input/prior/frozen-attempt.json build/prepared/prepared-linux.json build/prepared/verifier.tar.gz build
      - name: Verify existing candidate using the reviewed completion mode
        env:
          GH_TOKEN: ${{ github.token }}
          READINESS_RUN_ID: ${{ inputs.readiness_run_id }}
          COMPLETION_MODE: ${{ inputs.mode }}
        run: python3 build/tools/resume_publication.py "$COMPLETION_MODE" build/input
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: frozen-attempt
          path: build/evidence/frozen-attempt.json
          if-no-files-found: ignore
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frozen-candidate
          path: build/evidence/frozen-candidate.json
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: completion-report
          path: build/evidence/completion-report.json
          if-no-files-found: ignore
          retention-days: 30
