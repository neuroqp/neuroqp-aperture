name: Publish

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact tested source commit
        required: true
      package_run_id:
        description: Successful Package run containing release-files
        required: true
      smoke_json:
        description: Fixed four-environment native package smoke reports JSON
        required: true
      accept_unverified_targets:
        description: Accept OS compatibility risk for smoke targets reported unverified
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  trust:
    uses: ./.github/workflows/trusted-inputs.yml
    with:
      source_sha: ${{ inputs.source_sha }}
      run_workflow: package.yml
      run_id: ${{ inputs.package_run_id }}

  publish:
    needs: trust
    if: >-
      github.ref == 'refs/heads/main' && needs.trust.outputs.revision == inputs.source_sha
      && needs.trust.outputs.run_id != '' && needs.trust.outputs.run_id == inputs.package_run_id
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.trust.outputs.revision }}
          persist-credentials: false
      # Publication rules come from this main workflow revision; identities from the exact source above.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .publish-policy
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          run-id: ${{ needs.trust.outputs.run_id }}
          github-token: ${{ github.token }}
          path: build/release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-manifest
          run-id: ${{ needs.trust.outputs.run_id }}
          github-token: ${{ github.token }}
          path: build
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends minisign
      - name: Publish exact tested bytes, reusing matching existing uploads
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_JSON: ${{ inputs.smoke_json }}
          ACCEPT_UNVERIFIED: ${{ inputs.accept_unverified_targets }}
        run: |
          python3 -c 'import os; from pathlib import Path; Path("build/smoke.json").write_text(os.environ["NATIVE_JSON"])'
          accepted=()
          if [ "$ACCEPT_UNVERIFIED" = true ]; then accepted=(--accept-unverified); fi
          python3 .publish-policy/scripts/release/release-state.py publish build/release build/package.json build/smoke.json "${accepted[@]}"
