name: Package validation

on:
  push:
    branches: [feat/windows-linux-releases]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    uses: ./.github/workflows/package-build.yml
    with:
      source_sha: ${{ github.sha }}
      signed: false
    # No secrets are passed to unsigned feature-branch validation.
