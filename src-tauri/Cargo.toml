[package]
license = "MIT"
name = "aperture"
version = "0.3.0"
description = "A minimal tiled desktop image viewer"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }
libvips = { path = "vendor/libvips" }
# Releases ship raw Setup and AppImage updater assets, so skip archive support.
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls", "system-proxy"] }
tauri-plugin-opener = "2"
same-file = "1"
image = { version = "0.25.10", default-features = false, features = ["bmp"] }
openreadout-core = "=0.3.0"
openreadout-nd2 = "=0.3.0"
openreadout-czi = "=0.3.0"
openreadout-jpegxr = "=0.3.0"
rayon = "1"
flate2 = "=1.1.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.dev]
debug = 0

# Native preview loops need optimization in the desktop development build too.
# Keep dependencies at their usual dev settings to avoid rebuilding the stack.
[profile.dev.package.aperture]
opt-level = 2

[profile.release]
strip = true
