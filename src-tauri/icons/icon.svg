<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1024 1024"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">NeuroQP Aperture</title>
  <desc id="desc">
    Six alternating purple and orange shutter blades with equal transparent
    seams.
  </desc>
  <!-- Circle radius 402; construction hexagon circumradius 177; rotation -160 degrees.
       Inset each shared seam line by 6 on both sides, giving a 12-unit gap.
       All three corners use tangent circular fillets of radius 8.
       One blade is repeated at exactly 60-degree intervals. -->
  <defs>
    <radialGradient
      id="purple"
      gradientUnits="userSpaceOnUse"
      cx="-65"
      cy="-250"
      r="280"
    >
      <stop stop-color="#74418d" />
      <stop offset="1" stop-color="#6f3d88" />
    </radialGradient>
    <radialGradient
      id="orange"
      gradientUnits="userSpaceOnUse"
      cx="-65"
      cy="-250"
      r="280"
    >
      <stop stop-color="#f87f02" />
      <stop offset="1" stop-color="#f57b00" />
    </radialGradient>
    <path
      id="blade"
      d="M -164.627492 -85.459773 L -209.048373 -337.383108 A 8 8 0 0 1 -205.254579 -345.650919 A 402 402 0 0 1 169.101105 -364.703738 A 8 8 0 0 1 170.87821 -351.317596 L -151.606729 -80.720603 A 8 8 0 0 1 -164.627492 -85.459773 Z"
    />
  </defs>
  <g transform="translate(512 512)">
    <use href="#blade" fill="url(#purple)" />
    <use href="#blade" fill="url(#orange)" transform="rotate(60)" />
    <use href="#blade" fill="url(#purple)" transform="rotate(120)" />
    <use href="#blade" fill="url(#orange)" transform="rotate(180)" />
    <use href="#blade" fill="url(#purple)" transform="rotate(240)" />
    <use href="#blade" fill="url(#orange)" transform="rotate(300)" />
  </g>
</svg>
